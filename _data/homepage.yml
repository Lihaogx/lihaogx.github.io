research:
  title: "Research"
  items:
    - title: "Topological Learning for Dynamic Graphs"
      description: "I develop topology-aware representation learning for temporal, higher-order, and evolving relational data by combining persistent homology, Dowker and zigzag constructions, and graph neural networks. My recent work includes neural persistence-diagram approximation and topology-guided link prediction."
    - title: "Social Networks and Opinion Dynamics"
      description: "I study opinion propagation and social influence in complex networks. My work combines topic-specific social media data, synthetic opinion-dynamics datasets, and graph neural networks to build robust opinion-prediction models."
    - title: "LLM Agents for Social Simulation"
      description: "I build large language model agents for political and social simulation, with a focus on legislative decision prediction and fair redistricting. This work uses multi-source behavioral data and game-theoretic interactions among agents."

